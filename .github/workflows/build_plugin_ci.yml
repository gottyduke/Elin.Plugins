name: Elin Plugin CI Deploy

on:
  workflow_call:
    inputs:
      plugin_name:
        required: true
        type: string
      plugin_path:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string
      release_name_prefix:
        required: true
        type: string
      include_cwl:
        required: false
        type: boolean
        default: true
      include_emmersive:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
      nuget_cache:
        required: false
        type: boolean
        default: true
      artifact_name_prefix:
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-and-upload:
    name: Build
    runs-on: windows-latest
    env:
      PUBLISH_RELEASE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    strategy:
      fail-fast: false
      matrix:
        version: [nightly, stable]
        configuration: [Debug, Release]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            ${{ inputs.include_cwl && 'CustomWhateverLoader/' || '' }}
            ${{ inputs.include_emmersive && 'Emmersive/' || '' }}
            ${{ inputs.plugin_name }}/
            Directory.Build.props
            global.json
          sparse-checkout-cone-mode: false

      - name: Checkout Deps
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: ${{ matrix.version }}
          ref: ${{ matrix.version }}
          repository: gottyduke/Elin.Plugins.BuildDeps
          ssh-key: ${{ secrets.DEPS_DEPLOY_KEY }}

      - name: Setup Deps Tag
        id: deps
        shell: pwsh
        run: |
          pushd ${{ github.workspace }}\${{ matrix.version }}
          $tag = git describe --tags --abbrev=0 ${{ matrix.version }}
          popd
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup DotNet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ github.workspace }}\global.json
          cache: ${{ inputs.nuget_cache }}
          cache-dependency-path: |
            ${{ inputs.include_cwl && format('{0}\CustomWhateverLoader\packages.lock.json', github.workspace) || '' }}
            ${{ inputs.include_emmersive && format('{0}\Emmersive\packages.lock.json', github.workspace) || '' }}
            ${{ github.workspace }}\${{ inputs.plugin_path }}\packages.lock.json

      - name: Setup Packages
        run: |
          ${{ inputs.include_cwl && format('dotnet restore {0}\CustomWhateverLoader\ --locked-mode', github.workspace) || '' }}
          ${{ inputs.include_emmersive && format('dotnet restore {0}\Emmersive\ --locked-mode', github.workspace) || '' }}
          dotnet restore ${{ github.workspace }}\${{ inputs.plugin_path }}\ --locked-mode

      - name: Build
        id: build
        env:
          ElinGamePath: ${{ github.workspace }}\${{ matrix.version }}
        shell: pwsh
        run: |
          $cfgBase = '${{ matrix.configuration }}'
          $config = if ('${{ matrix.version }}' -eq 'nightly') { "${cfgBase}Nightly" } else { $cfgBase }

          $outDir = "${{ github.workspace }}\out\${{ matrix.version }}-${{ matrix.configuration }}"
          ${{ inputs.include_cwl && format('dotnet build {0}\CustomWhateverLoader\CustomWhateverLoader.csproj -o {0}\{1}\Package\Mod_CustomWhateverLoader -c $config --no-restore', github.workspace, matrix.version) || '' }}
          ${{ inputs.include_emmersive && format('dotnet build {0}\Emmersive\Emmersive.csproj -o {0}\{1}\Package\Mod_Emmersive -c $config --no-restore', github.workspace, matrix.version) || '' }}
          dotnet build ${{ github.workspace }}\${{ inputs.plugin_path }}\${{ inputs.plugin_name }}.csproj -o $outDir -c $config --no-restore ${{ inputs.include_emmersive && format('-p:EmmersiveDllPath={0}\{1}\Package\Mod_Emmersive\Emmersive.dll', github.workspace, matrix.version) || '' }}

          $dllPath = Join-Path -Path $outDir -ChildPath "${{ inputs.plugin_name }}.dll"
          $fileVersion = (Get-Item -Path $dllPath).VersionInfo.FileVersion
          $fileVersionShort = $fileVersion.Split('.')[0..2] -join '.'
          $debugSuffix = if ('${{ matrix.configuration }}' -eq 'Debug') { 'debug' } else { 'release' }

          echo "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          echo "file_version_short=$fileVersionShort" >> $env:GITHUB_OUTPUT
          echo "file_name=${{ inputs.artifact_name_prefix }}-ci-builds-$fileVersion-${{ steps.deps.outputs.tag }}-$debugSuffix" >> $env:GITHUB_OUTPUT
          echo "out_dir=$outDir" >> $env:GITHUB_OUTPUT
          echo "debug_suffix=$debugSuffix" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.file_name }}
          path: ${{ steps.build.outputs.out_dir }}

      - name: Prepare Release
        if: env.PUBLISH_RELEASE == 'true'
        id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = "${{ steps.build.outputs.out_dir }}"
          $debugSuffix = "${{ steps.build.outputs.debug_suffix }}"
          $destination = "${{ steps.build.outputs.out_dir }}\${{ inputs.artifact_name_prefix }}-ci-builds-${{ steps.deps.outputs.tag }}-$debugSuffix.zip"

          Compress-Archive -Path "$source\*" -DestinationPath $destination -Force
          $path = $destination -Replace '\\', '/'

          $repo = "${{ github.repository }}"
          $repoUrl = "${{ github.server_url }}/$repo"
          $prefix = "${{ inputs.tag_prefix }}"
          $version = [version]"${{ steps.build.outputs.file_version_short }}"
          $tag = "$prefix-${{ steps.build.outputs.file_version_short }}"
          $head = git rev-parse HEAD

          gh api "repos/$repo/git/ref/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh api -X PATCH "repos/$repo/git/refs/tags/$tag" -f sha=$head -F force=true --silent
            if ($LASTEXITCODE -ne 0) { throw "failed to move $tag to $head" }
          }

          $existing = (gh release view $tag -R $repo --json body -q .body 2>$null) -join "`n"

          $lastTag = git tag -l "$prefix-*" |
            ? { $v = $null; [version]::TryParse($_.Substring($prefix.Length + 1), [ref]$v) -and $v -lt $version } |
            Sort-Object { [version]$_.Substring($prefix.Length + 1) } -Descending |
            Select-Object -First 1

          $begin = '<!-- ci-changelog -->'
          $end = '<!-- /ci-changelog -->'
          $notes = @($begin)
          if ($lastTag) {
            $notes += "Previous release: [$lastTag]($repoUrl/releases/tag/$lastTag) ([compare]($repoUrl/compare/$lastTag...$tag))"
            $notes += ""
            $notes += @(git log "$lastTag...HEAD" --right-only --cherry-pick --no-merges --date=format:"%y-%m-%d %H:%M" --pretty=format:"%H%x09%h%x09%cd%x09%s" -- ${{ inputs.plugin_path }} |
              % { $sha, $short, $date, $subject = $_ -split "`t", 4; if ($subject -notmatch 'cleanup|bump version') { "- $date [$short]($repoUrl/commit/$sha) $subject" } })
          } else {
            $notes += "Initial release."
          }
          $notes += $end
          $block = $notes -join "`n"

          $i = $existing.IndexOf($begin)
          $j = $existing.IndexOf($end)
          if ($i -ge 0 -and $j -gt $i) {
            $body = $existing.Substring(0, $i) + $block + $existing.Substring($j + $end.Length)
          } else {
            $manual = (($existing -split '\r?\n' | ? { $_ -notmatch '^(Last Tag \(|- \d{2}-\d{2}-\d{2} \d{2}:\d{2} [0-9a-f]{7,} )' }) -join "`n").Trim()
            $body = if ($manual) { "$block`n`n$manual" } else { $block }
          }

          $notesPath = "$env:RUNNER_TEMP\release_notes.md"
          $body | Set-Content -Path $notesPath -Encoding utf8
          echo "artifact_path=$path" >> $env:GITHUB_OUTPUT
          echo "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          echo "head_sha=$head" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create or Update Release
        if: env.PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_prefix }}-${{ steps.build.outputs.file_version_short }}
          target_commitish: ${{ steps.artifact.outputs.head_sha }}
          name: ${{ inputs.release_name_prefix }} ${{ steps.build.outputs.file_version }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body_path: ${{ steps.artifact.outputs.notes_path }}
          files: ${{ steps.artifact.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Stale Assets
        if: env.PUBLISH_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ steps.artifact.outputs.tag }}"
          $current = Split-Path "${{ steps.artifact.outputs.artifact_path }}" -Leaf
          $slot = "${{ inputs.artifact_name_prefix }}-ci-builds-${{ matrix.version }}-*-${{ steps.build.outputs.debug_suffix }}.zip"

          $assets = @(gh release view $tag -R $repo --json assets -q '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "failed to list assets of $tag" }

          $assets | ? { $_ -like $slot -and $_ -ne $current } | % {
            gh release delete-asset $tag $_ -R $repo -y
            if ($LASTEXITCODE -ne 0) { throw "failed to delete $_ from $tag" }
          }